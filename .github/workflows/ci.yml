# Putcafe CI — build and deploy frontend + backend to the shared VPS edge.
#
# Monorepo, path-filtered: the `changes` job detects which top-level area moved,
# and each deploy job runs only when its own files changed (frontend/** -> web,
# backend/** -> api), so a frontend-only push never rebuilds the API and vice versa.
#
# Deploy targets (one Caddy serves /root/putcafe/site over HTTPS — see
# scripts/dev/remote/edge/):
#   web    Prod:    push a version tag `v*`          -> /web/          (GATED)
#          Staging: push to `main`                   -> /web/staging/
#          Preview: push to `feature/**` or `dev/**` -> /web/<slot>/   (`feature/` stripped)
#   api    push to `main`                            -> /root/putcafe/api (compose up --build)
#          manual: Actions "Run workflow" on any branch with deploy_api checked —
#          test backend changes pre-merge. The API stack is SHARED (one stack for
#          all slots): a branch dispatch overwrites what main deployed; the next
#          backend push to main restores it.
#
# The prod job declares `environment: production` — GitHub's required-reviewer gate,
# created by scripts/dev/local/edge/setup-github.sh. Approve the run in the repo UI.
#
# Required GitHub config (set by setup-github.sh):
#   Secret    VPS_SSH_KEY   private half of the putcafe_ci deploy key
#   Variables VPS_HOST / VPS_USER / VPS_PORT

name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'dev/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy the API stack from this ref (shared stack — overwrites main's deploy)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Detect which areas changed (path filter) -------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        # Push only — a manual dispatch has no push diff; its deploys are driven
        # by the deploy_api input alone (outputs stay empty, so web/api path
        # conditions are false).
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # --- Build + deploy: branch (staging + previews, auto) ----------------------
  web:
    needs: changes
    if: github.ref_type == 'branch' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Compute deploy slot
        id: slot
        # main -> the reserved `staging` slot; feature/** is stripped, dev/** keeps
        # its path. Slot leaves are isolated, so they mirror with --delete (only the
        # prod root job must NOT --delete — it would wipe sibling slots).
        run: |
          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then slot="staging"; else slot="${ref#feature/}"; fi
          echo "dir=/root/putcafe/site/web/$slot" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        # vite base is relative ("./"), so one build serves at any slot depth.
        run: |
          cd frontend
          yarn --frozen-lockfile
          yarn build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy → VPS (and regenerate the root landing page)
        run: |
          # Marker read by gen-landing-index.sh to show the deployed commit per landing row.
          echo "${GITHUB_SHA:0:7}" > frontend/dist/.putcafe-sha
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p ${{ steps.slot.outputs.dir }}'
          rsync -az --delete -e "ssh -p ${{ vars.VPS_PORT }}" \
            frontend/dist/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:${{ steps.slot.outputs.dir }}/"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/putcafe/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "bash /root/putcafe/gen-landing-index.sh /root/putcafe/site"

  # --- Build + deploy: prod (tag, GATED) --------------------------------------
  web-prod:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend
        run: |
          cd frontend
          yarn --frozen-lockfile
          yarn build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy → VPS prod root (and regenerate the root landing page)
        # The root must NOT use --delete: it would wipe the sibling staging/preview
        # slot dirs that live under site/web/.
        run: |
          # Marker read by gen-landing-index.sh to show the deployed commit per landing row.
          echo "${GITHUB_SHA:0:7}" > frontend/dist/.putcafe-sha
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p /root/putcafe/site/web'
          rsync -az -e "ssh -p ${{ vars.VPS_PORT }}" \
            frontend/dist/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/putcafe/site/web/"
          scp -P "${{ vars.VPS_PORT }}" scripts/dev/remote/edge/gen-landing-index.sh \
            "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/putcafe/gen-landing-index.sh"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "bash /root/putcafe/gen-landing-index.sh /root/putcafe/site"

  # --- Deploy API stack (main + backend changes, or manual deploy_api dispatch
  # from any branch; Docker layer cache on the box) ------------------------------
  api:
    needs: changes
    if: >-
      (github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy backend → VPS (compose up --build)
        run: |
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'mkdir -p /root/putcafe/api'
          rsync -az --delete --exclude node_modules --exclude dist --exclude __pycache__ \
            -e "ssh -p ${{ vars.VPS_PORT }}" \
            backend/ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/root/putcafe/api/"
          ssh -p "${{ vars.VPS_PORT }}" "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'cd /root/putcafe/api && docker compose up -d --build --remove-orphans'
